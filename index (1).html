<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="森のぬくもりに包まれる架空の洋菓子店 Petite Forêt のランディングページです。">
  <title>Petite Forêt｜森のぬくもりに包まれる小さな洋菓子店</title>
  <link rel="preload" as="image" href="https://static.wixstatic.com/media/056e8e_8d0af8bb278f48ff8e0ce866ffe0c537~mv2.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Petite Forêt トップへ">Petite Forêt</a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="site-nav" aria-label="ページ内メニュー">
      <a href="#shop">店舗</a>
      <a href="#sweets">お菓子</a>
      <a href="#cafe">カフェ</a>
      <a href="#packaging">ギフト</a>
      <a href="#information">店舗情報</a>
    </nav>
  </header>

  <main id="main">
    <section id="top" class="visual-section hero" aria-label="Petite Forêt ブランドイメージ">
      <img src="https://static.wixstatic.com/media/056e8e_8d0af8bb278f48ff8e0ce866ffe0c537~mv2.png" alt="森のぬくもりに包まれる洋菓子店 Petite Forêt の店舗、ケーキ、カフェ、パッケージをまとめたブランドイメージ" width="1920" height="1080">
      <a class="image-hotspot hero-hotspot" href="#sweets" aria-label="季節のお菓子を見る"></a>
    </section>

    <section id="shop" class="visual-section" aria-label="店舗について">
      <img loading="lazy" src="https://static.wixstatic.com/media/056e8e_78e52348b886476fb9a66c5f10e06154~mv2.png" alt="木の温かみと緑に包まれた Petite Forêt の外観と店内" width="1920" height="1080">
    </section>

    <section id="sweets" class="visual-section" aria-label="季節のお菓子">

    </section>

    <section id="cafe" class="visual-section" aria-label="店内限定カフェオレ">

    </section>

    <section id="packaging" class="visual-section" aria-label="パッケージデザイン">
      <img loading="lazy" src="https://static.wixstatic.com/media/056e8e_b928d7151c114023833cd4eefebf8703~mv2.png" alt="Petite Forêt の紙袋、ギフトボックス、焼き菓子箱、カードなどのパッケージデザイン" width="1920" height="1080">
      <a class="image-hotspot packaging-hotspot" href="#information" aria-label="店舗情報を見る"></a>
    </section>

    <section id="information" class="visual-section" aria-label="店舗情報">
      <img loading="lazy" src="https://static.wixstatic.com/media/056e8e_a56c12e0d4744d72aedc9f14db0d292d~mv2.png" alt="Petite Forêt の営業時間、定休日、所在地、電話番号を掲載した店舗情報" width="1920" height="1080">
      <a class="image-hotspot information-hotspot" href="#top" aria-label="ページの先頭へ戻る"></a>

    <p>Petite Forêt — 森のぬくもりに包まれる、小さな洋菓子店。</p>
